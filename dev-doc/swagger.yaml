basePath: /
definitions:
  account.GetProfileResponse:
    properties:
      account_name:
        type: string
      current_user:
        $ref: '#/definitions/account.UserProfileItem'
      email:
        type: string
      public_id:
        type: string
      status:
        type: string
      user_ids:
        items:
          type: integer
        type: array
    type: object
  account.LoginRequest:
    properties:
      device_id:
        type: string
      identifier:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - device_id
    - identifier
    - password
    type: object
  account.LoginResponse:
    type: object
  account.RegisterRequest:
    properties:
      account:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - account
    - email
    - name
    - password
    type: object
  account.RegisterResponse:
    type: object
  account.UserProfileItem:
    properties:
      avatar:
        type: string
      id:
        type: integer
      name:
        type: string
      role_codes:
        items:
          type: string
        type: array
    type: object
  account.VerifyEmailResponse:
    type: object
  device.DeviceUpdateRequest:
    properties:
      device_name:
        type: string
      platform:
        type: string
    required:
    - device_name
    - platform
    type: object
  device.DeviceUpdateResponse:
    properties:
      created_at:
        type: string
      device_id:
        type: string
      device_name:
        type: string
      platform:
        type: string
      success:
        type: boolean
    type: object
  device.GetDeviceInfoResponse:
    properties:
      created_at:
        type: string
      device_id:
        type: string
      device_name:
        type: string
      platform:
        type: string
      success:
        type: boolean
    type: object
  device.RegisterDeviceIdRequest:
    properties:
      device_id:
        type: string
      device_name:
        type: string
      platform:
        type: string
    required:
    - device_id
    - device_name
    - platform
    type: object
  device.RegisterDeviceIdResponse:
    properties:
      created_at:
        type: string
      device_id:
        type: string
      device_name:
        type: string
      platform:
        type: string
      success:
        type: boolean
    type: object
  participant.ParticipantResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      user_id:
        type: integer
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  user.GetUserProfileResponse:
    properties:
      avatar:
        type: string
      id:
        type: integer
      name:
        type: string
      role_codes:
        items:
          type: string
        type: array
    type: object
  user.UpdateProfileRequest:
    properties:
      name:
        maxLength: 50
        minLength: 1
        type: string
      role_codes:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  user.UploadAvatarResponse:
    properties:
      avatar_url:
        type: string
    type: object
host: dev.hiroliang.com
info:
  contact: {}
  description: Server for my all Goat application
  title: Goat-Server
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/account.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Account Login
      tags:
      - Auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Remove the session token from the redis store.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Account Logout
      tags:
      - Auth
  /api/auth/profile:
    get:
      description: Get the current account and user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.GetProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account profile
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: register with email and password
      parameters:
      - description: Register messages
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/account.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Account register
      tags:
      - Auth
  /api/auth/verify-email:
    get:
      description: Verify account email using the token sent during registration
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.VerifyEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify email address
      tags:
      - Auth
  /api/device/{device_id}:
    get:
      consumes:
      - application/json
      description: try to get device info
      parameters:
      - description: Device id
        in: path
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Device info
          schema:
            $ref: '#/definitions/device.GetDeviceInfoResponse'
      summary: getDeviceInfo
      tags:
      - Device
    patch:
      consumes:
      - application/json
      description: try to update device info
      parameters:
      - description: Device id
        in: path
        name: device_id
        required: true
        type: string
      - description: Device update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/device.DeviceUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/device.DeviceUpdateResponse'
      summary: updateDeviceInfo
      tags:
      - Device
  /api/device/register:
    post:
      consumes:
      - application/json
      description: try to register device id checking is id already registered
      parameters:
      - description: Register device
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/device.RegisterDeviceIdRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/device.RegisterDeviceIdResponse'
      summary: registerDeviceId
      tags:
      - Device
  /api/health:
    get:
      description: api health check
      responses: {}
      summary: api health check
      tags:
      - Health
  /api/participant/me:
    get:
      description: Retrieve the authenticated user's chat participant record
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/participant.ParticipantResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not registered yet
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my participant record
      tags:
      - Participant
  /api/participant/user:
    post:
      description: 'Register the authenticated user as a chat participant (idempotent:
        returns 409 if already registered)'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/participant.ParticipantResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Already registered
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register as participant
      tags:
      - Participant
  /api/user/{user_id}:
    get:
      description: Get a user's public profile by ID
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.GetUserProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get user profile
      tags:
      - User
  /api/user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload and replace the current user's avatar (jpeg/png/webp, max
        5 MB). The image is center-cropped and resized to 256×256.
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UploadAvatarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "413":
          description: Image Too Large
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload avatar
      tags:
      - User
  /api/user/profile:
    patch:
      consumes:
      - application/json
      description: Update the current user's display name
      parameters:
      - description: Profile update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/user.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
